version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: clinica-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-clinica_saas_bd}
      POSTGRES_USER: ${DB_USER:-clinica_saas_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinica_saas_secure_pass_2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - clinica-saas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clinica_saas_admin} -d ${DB_NAME:-clinica_saas_bd}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clinica-saas-server
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clinica_saas_bd}
      DB_USER: ${DB_USER:-clinica_saas_admin}
      DB_PASSWORD: ${DB_PASSWORD:-clinica_saas_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-clinica_saas_secret_key_2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4200}
      API_URL: ${API_URL:-http://localhost:5000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_NAME: ${FROM_NAME:-Clínica SaaS}
      FROM_EMAIL: ${FROM_EMAIL:-no-reply@clinicasaas.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinica-saas-network
    volumes:
      - uploads_data:/usr/src/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Angular
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clinica-saas-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - clinica-saas-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
    name: clinica_saas_postgres_data
  uploads_data:
    driver: local
    name: clinica_saas_uploads_data

networks:
  clinica-saas-network:
    driver: bridge
    name: clinica_saas_network
