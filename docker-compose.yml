version: '3.8'

# ==============================================================================
# Docker Compose Orchestration - Clinica SaaS Production & Staging
# Coordinated healthchecks, non-root isolated networks, persistent data volumes
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: clinica-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-clinica_saas_bd}
      POSTGRES_USER: ${DB_USER:-clinica_saas_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinica_saas_secure_pass_2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - db_backups:/var/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - clinica-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clinica_saas_admin} -d ${DB_NAME:-clinica_saas_bd} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Backend API Service (Node.js 20 Multi-Stage Hardened)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clinica-saas-server
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-clinica_saas_bd}
      DB_USER: ${DB_USER:-clinica_saas_admin}
      DB_PASSWORD: ${DB_PASSWORD:-clinica_saas_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-clinica_saas_production_super_secret_jwt_key_minimum_32_chars_2026}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-clinica_saas_backup_aes_encryption_key_2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4200}
      API_URL: ${API_URL:-http://localhost:5000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:80}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_NAME: ${FROM_NAME:-Clínica SaaS}
      FROM_EMAIL: ${FROM_EMAIL:-no-reply@clinicasaas.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinica-internal-net
      - clinica-dmz-net
    volumes:
      - uploads_data:/usr/src/app/uploads
      - storage_data:/usr/src/app/storage
      - db_backups:/usr/src/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # 3. Frontend Web App (Angular Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clinica-saas-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - clinica-dmz-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ==============================================================================
# Persistent Volumes Definition
# ==============================================================================
volumes:
  postgres_data:
    driver: local
    name: clinica_saas_postgres_data
  uploads_data:
    driver: local
    name: clinica_saas_uploads_data
  storage_data:
    driver: local
    name: clinica_saas_storage_data
  db_backups:
    driver: local
    name: clinica_saas_db_backups

# ==============================================================================
# Network Segmentation (Internal Data Layer vs DMZ Web Layer)
# ==============================================================================
networks:
  clinica-internal-net:
    driver: bridge
    internal: false
  clinica-dmz-net:
    driver: bridge
